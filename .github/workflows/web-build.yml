name: Web Production Build

on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'apps/web/**'
      - 'packages/lib/**'
      - 'packages/drizzle/**'
      - 'services/supabase/**'
      - 'bun.lock'
      - 'package.json'
      - '.github/workflows/web-build.yml'

concurrency:
  group: web-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-build:
    name: Web Production Build
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://build-smoke.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: build-smoke-placeholder-anon-key
      NEXT_PUBLIC_KYC_API_BASE_URL: https://build-smoke.invalid
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: build-smoke-placeholder-not-a-secret
      NEXT_PUBLIC_APP_ENV: production
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js environment
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-
      - name: Install dependencies
        run: bun install
      - name: Verify client/server boundary regression fixture
        working-directory: apps/web
        run: bun scripts/test-build-boundary.ts
      - name: Build web app
        working-directory: apps/web
        run: bun run build
        timeout-minutes: 20
